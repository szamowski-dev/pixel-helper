<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <header>
        <h1>Pixel Helper</h1>
        <label class="theme-switch" title="Dark appearance">
            <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark appearance">
            <span aria-hidden="true"></span>
        </label>
    </header>
    <nav class="provider-tabs" aria-label="Pixel providers">
        <button type="button" data-provider="Google tag" aria-label="Google" title="Google" aria-pressed="false" disabled><img class="brand-icon" src="images/provider-google.svg" alt=""></button>
        <button type="button" data-provider="Meta Pixel" aria-label="Meta" title="Meta" aria-pressed="false" disabled><img class="brand-icon" src="images/provider-meta.svg" alt=""></button>
        <button type="button" data-provider="TikTok Pixel" aria-label="TikTok" title="TikTok" aria-pressed="false" disabled><img class="brand-icon" src="images/provider-tiktok.svg" alt=""></button>
        <button type="button" data-provider="Reddit Pixel" aria-label="Reddit" title="Reddit" aria-pressed="false" disabled><img class="brand-icon" src="images/provider-reddit.svg" alt=""></button>
        <button type="button" data-provider="X Pixel" aria-label="X" title="X" aria-pressed="false" disabled><img class="brand-icon" src="images/provider-x.svg" alt=""></button>
    </nav>
    <main>
        <p id="headline" role="status">Loading…</p>
        <p id="hint" hidden>Select a provider to see its pixels.</p>
        <div id="pixels" hidden></div>
    </main>
    <footer>Observed request URLs only. Delivery status and POST bodies are unavailable.</footer>
</body>
</html>
